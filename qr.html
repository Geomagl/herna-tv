<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>QR Docházka</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
  #qr-wrap {
    position: fixed;
    bottom: 24px;
    right: 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }
  #qr-img {
    display: block;
    width: 180px;
    height: 180px;
    border-radius: 4px;
    background: #fff;
  }
  #qr-label {
    font-family: Arial, sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #888;
  }
</style>
</head>
<body>
<div id="qr-wrap">
  <img id="qr-img" src="" alt="QR Docházka"/>
  <span id="qr-label">Docházka</span>
</div>
<script>
const SUPABASE_URL = "https://ltdluiumymxgqhcdsjbg.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx0ZGx1aXVteW14Z3FoY2RzamJnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcxOTU3NzAsImV4cCI6MjA5Mjc3MTc3MH0._iWumZkcLJzeG6Qzj2I7ezeN-ulBUsyR3Y-O15dM_oY";

// Před 5:00 ráno vrátí včerejší datum – golmani odcházejí z noční až ráno
function qrDate() {
  const d = new Date();
  if (d.getHours() < 5) d.setDate(d.getDate() - 1);
  return d.getFullYear() + "-" +
    String(d.getMonth() + 1).padStart(2, "0") + "-" +
    String(d.getDate()).padStart(2, "0");
}

// V 5:00 ráno přenačte stránku – přepne na dnešní QR
function scheduleRefreshAt5am() {
  const now = new Date();
  let next = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 5, 0, 0);
  if (now >= next) next.setDate(next.getDate() + 1);
  setTimeout(() => location.reload(), next - now);
}

async function loadQR() {
  const date = qrDate();
  try {
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/qr_codes?date=eq.${date}&select=code`,
      { headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` } }
    );
    const data = await res.json();
    const code = data && data[0] && data[0].code;
    if (code) {
      document.getElementById("qr-img").src =
        "https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=" +
        encodeURIComponent(code) + "&bgcolor=ffffff&color=000000&margin=1";
    }
  } catch (e) {
    // tiché selhání – zkusí znovu za minutu
  }
}

loadQR();
setInterval(loadQR, 60000); // kontrola každou minutu
scheduleRefreshAt5am();
</script>
</body>
</html>
