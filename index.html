<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Herna TV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Inter', sans-serif; }
  #layout { display: flex; width: 100vw; height: 100vh; }

  #sidebar {
    width: 420px; flex-shrink: 0; background: #0a0a0a;
    border-right: 1px solid #1a1a1a; display: flex; flex-direction: column;
    padding: 32px 28px; overflow: hidden; color: #fff;
  }

  .clock-big  { font-size: 64px; font-weight: 500; letter-spacing: 2px; line-height: 1; }
  .date-label { font-size: 16px; color: #888; margin-top: 6px; margin-bottom: 28px; }

  .main-card {
    border-radius: 18px; padding: 28px 24px; border: 2px solid transparent;
    text-align: center; transition: background 0.5s, border-color 0.5s; margin-bottom: 24px;
  }
  .phase-type { font-size: 13px; font-weight: 500; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 4px; opacity: 0.7; }
  .phase-name { font-size: 44px; font-weight: 500; line-height: 1.1; margin-bottom: 12px; }
  .timer-val  { font-size: 88px; font-weight: 500; letter-spacing: -4px; line-height: 1; margin-bottom: 6px; }
  .timer-unit { font-size: 13px; color: #555; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 20px; }
  .progress-bar-bg   { height: 8px; border-radius: 4px; background: #1a1a1a; overflow: hidden; }
  .progress-bar-fill { height: 100%; border-radius: 4px; transition: width 1s linear, background 1s; }

  .section-label { font-size: 11px; color: #666; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 12px; }
  .next-slots { display: flex; flex-direction: column; gap: 10px; flex: 1; }
  .next-slot  { border-radius: 12px; padding: 14px 16px; border: 1px solid #1c1c1c; display: flex; flex-direction: column; gap: 2px; }
  .ns-label   { font-size: 10px; letter-spacing: 3px; text-transform: uppercase; }
  .ns-type    { font-size: 11px; opacity: 0.6; margin-bottom: 1px; }
  .ns-name    { font-size: 22px; font-weight: 500; }
  .ns-time    { font-size: 13px; }
  .slot-dim   { opacity: 0.55; }

  #yt-wrap { flex: 1; background: #000; display: flex; align-items: center; justify-content: center; }
  #yt-wrap iframe { width: 100%; height: 100%; border: none; display: block; }
  #no-stream { color: #333; font-size: 22px; text-align: center; line-height: 1.6; }
  #no-stream span { display: block; font-size: 48px; margin-bottom: 16px; }
</style>
</head>
<body>
<div id="layout">
  <div id="sidebar">
    <div class="clock-big" id="clock">--:--</div>
    <div class="date-label" id="date-label"></div>

    <div class="main-card" id="main-card">
      <div class="phase-type" id="phase-type"></div>
      <div class="phase-name" id="phase-name">—</div>
      <div class="timer-val"  id="timer-val">--:--</div>
      <div class="timer-unit">zbývá</div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progress-fill" style="width:0%"></div>
      </div>
    </div>

    <div class="section-label">Nadcházející</div>
    <div class="next-slots">
      <div class="next-slot" id="next0">
        <div class="ns-label" id="next0-label">Následuje</div>
        <div class="ns-type"  id="next0-type"></div>
        <div class="ns-name"  id="next0-name">—</div>
        <div class="ns-time"  id="next0-time"></div>
      </div>
      <div class="next-slot slot-dim" id="next1">
        <div class="ns-label" id="next1-label">Potom</div>
        <div class="ns-type"  id="next1-type"></div>
        <div class="ns-name"  id="next1-name">—</div>
        <div class="ns-time"  id="next1-time"></div>
      </div>
      <div class="next-slot slot-dim" id="next2">
        <div class="ns-label" id="next2-label">A pak</div>
        <div class="ns-type"  id="next2-type"></div>
        <div class="ns-name"  id="next2-name">—</div>
        <div class="ns-time"  id="next2-time"></div>
      </div>
    </div>
  </div>

  <div id="yt-wrap">
    <div id="no-stream">
      <span>📺</span>
      Živý přenos není nastaven.<br>
      Přejdi do admin panelu a vlož odkaz.
    </div>
  </div>
</div>

<script>
const GITHUB_USER = "Geomagl";
const GITHUB_REPO = "herna-tv";

// Fallback schedule (used until schedule.json loads)
let schedule = [
  {type:"nastup",start:"08:57",end:"09:00",name:""},
  {type:"hra",   start:"09:00",end:"09:25",name:""},
  {type:"nastup",start:"09:25",end:"09:28",name:""},
  {type:"hra",   start:"09:28",end:"09:53",name:""},
  {type:"nastup",start:"09:53",end:"09:56",name:""},
  {type:"hra",   start:"09:56",end:"10:21",name:""},
  {type:"nastup",start:"10:21",end:"10:24",name:""},
  {type:"hra",   start:"10:24",end:"10:49",name:""},
  {type:"nastup",start:"10:49",end:"10:52",name:""},
  {type:"hra",   start:"10:52",end:"11:17",name:""},
  {type:"nastup",start:"11:17",end:"11:20",name:""},
  {type:"hra",   start:"11:20",end:"11:45",name:""},
  {type:"nastup",start:"11:45",end:"11:48",name:""},
  {type:"hra",   start:"11:48",end:"12:13",name:""},
  {type:"nastup",start:"12:13",end:"12:16",name:""},
  {type:"hra",   start:"12:16",end:"12:41",name:""},
  {type:"pauza", start:"12:41",end:"12:53",name:""},
  {type:"nastup",start:"12:53",end:"12:56",name:""},
  {type:"hra",   start:"12:56",end:"13:21",name:""},
  {type:"nastup",start:"13:21",end:"13:24",name:""},
  {type:"hra",   start:"13:24",end:"13:49",name:""},
  {type:"nastup",start:"13:49",end:"13:52",name:""},
  {type:"hra",   start:"13:52",end:"14:17",name:""},
  {type:"nastup",start:"14:17",end:"14:20",name:""},
  {type:"hra",   start:"14:20",end:"14:45",name:""},
  {type:"nastup",start:"14:45",end:"14:48",name:""},
  {type:"hra",   start:"14:48",end:"15:13",name:""},
  {type:"nastup",start:"15:13",end:"15:16",name:""},
  {type:"hra",   start:"15:16",end:"15:41",name:""},
  {type:"nastup",start:"15:41",end:"15:44",name:""},
  {type:"hra",   start:"15:44",end:"16:09",name:""},
  {type:"nastup",start:"16:09",end:"16:12",name:""},
  {type:"hra",   start:"16:12",end:"16:37",name:""},
  {type:"nastup",start:"16:37",end:"16:40",name:""},
  {type:"hra",   start:"16:40",end:"17:05",name:""},
];

let labels = {hra:"Match",nastup:"Warm-up",pauza:"Break",konec:"Session complete"};

const colors = {
  hra:   {bg:"#071a04",border:"#a3e635",text:"#a3e635",fill:"#a3e635"},
  nastup:{bg:"#1f1200",border:"#ff9800",text:"#ff9800",fill:"#ff9800"},
  pauza: {bg:"#0d0d1f",border:"#7c7cff",text:"#7c7cff",fill:"#7c7cff"},
};
const dimColors = {
  hra:   {bg:"#0a1f06",border:"#3a5c10",text:"#7ab82e",timeColor:"#5a8a22",labelColor:"#4e7a1c"},
  nastup:{bg:"#1a0e00",border:"#6b3d00",text:"#cc7a00",timeColor:"#aa6200",labelColor:"#8a5200"},
  pauza: {bg:"#0a0a1a",border:"#3a3a8a",text:"#6060cc",timeColor:"#4a4aaa",labelColor:"#3a3a8a"},
};

function toSec(t){const[h,m]=t.split(":").map(Number);return h*3600+m*60;}
function nowSec(){const n=new Date();return n.getHours()*3600+n.getMinutes()*60+n.getSeconds();}
function pad(n){return String(n).padStart(2,"0");}

function slotDisplayName(slot){
  const base = slot.type==="hra" ? labels.hra : slot.type==="nastup" ? labels.nastup : labels.pauza;
  return slot.name ? slot.name : base;
}
function slotTypeName(slot){
  return slot.type==="hra" ? labels.hra : slot.type==="nastup" ? labels.nastup : labels.pauza;
}

function getColor(slot,secsLeft,totalSecs){
  if(slot.type==="nastup"){
    const ratio=secsLeft/totalSecs;
    if(ratio<=1/3){
      const t=1-(ratio/(1/3));
      const r=255,g=Math.round(152*(1-t));
      return{...colors.nastup,text:`rgb(${r},${g},0)`,fill:`rgb(${r},${g},0)`,border:`rgba(${r},${g},0,0.5)`};
    }
    return colors.nastup;
  }
  return colors[slot.type]||colors.pauza;
}

function setNextSlot(i,slot,bright){
  const el=document.getElementById("next"+i);
  const tp=document.getElementById("next"+i+"-type");
  const nm=document.getElementById("next"+i+"-name");
  const tm=document.getElementById("next"+i+"-time");
  const lb=document.getElementById("next"+i+"-label");
  if(slot){
    const hasName = slot.name && slot.name.trim();
    if(bright){
      const c=colors[slot.type]||colors.pauza;
      el.style.background=c.bg; el.style.borderColor=c.border;
      nm.style.color=c.text; lb.style.color=c.text; tm.style.color="#999"; tp.style.color=c.text;
    } else {
      const c=dimColors[slot.type]||dimColors.pauza;
      el.style.background=c.bg; el.style.borderColor=c.border;
      nm.style.color=c.text; lb.style.color=c.labelColor; tm.style.color=c.timeColor; tp.style.color=c.labelColor;
    }
    // If slot has a name, show type small + name big; otherwise just type big
    if(hasName){
      tp.textContent=slotTypeName(slot);
      nm.textContent=slot.name;
    } else {
      tp.textContent="";
      nm.textContent=slotTypeName(slot);
    }
    tm.textContent=slot.start+" – "+slot.end;
  } else {
    el.style.background="#0d0d0d"; el.style.borderColor="#141414";
    nm.style.color="#333"; nm.textContent="—"; tm.textContent=""; lb.style.color="#333"; tp.textContent="";
  }
}

function tick(){
  const now=new Date();
  document.getElementById("clock").textContent=pad(now.getHours())+":"+pad(now.getMinutes());
  const days=["Neděle","Pondělí","Úterý","Středa","Čtvrtek","Pátek","Sobota"];
  const months=["ledna","února","března","dubna","května","června","července","srpna","září","října","listopadu","prosince"];
  document.getElementById("date-label").textContent=days[now.getDay()]+", "+now.getDate()+". "+months[now.getMonth()]+" "+now.getFullYear();

  const ns=nowSec();
  let cur=-1;
  for(let i=0;i<schedule.length;i++){
    if(ns>=toSec(schedule[i].start)&&ns<toSec(schedule[i].end)){cur=i;break;}
  }

  const card=document.getElementById("main-card");
  const pType=document.getElementById("phase-type");
  const pName=document.getElementById("phase-name");
  const timerVal=document.getElementById("timer-val");
  const progFill=document.getElementById("progress-fill");
  const nextStart=cur>=0?cur+1:(ns<toSec(schedule[0].start)?0:schedule.length);

  if(cur>=0){
    const slot=schedule[cur];
    const endS=toSec(slot.end),startS=toSec(slot.start);
    const totalSecs=endS-startS,secsLeft=endS-ns;
    const pct=Math.min(100,((ns-startS)/totalSecs)*100);
    const c=getColor(slot,secsLeft,totalSecs);
    card.style.background=c.bg; card.style.borderColor=c.border;
    pType.style.color=c.text;
    pName.style.color=c.text;
    const hasName=slot.name&&slot.name.trim();
    if(hasName){
      pType.textContent=slotTypeName(slot);
      pName.textContent=slot.name;
    } else {
      pType.textContent="";
      pName.textContent=slotTypeName(slot);
    }
    timerVal.style.color="#fff";
    timerVal.textContent=pad(Math.floor(secsLeft/60))+":"+pad(secsLeft%60);
    progFill.style.width=pct+"%"; progFill.style.background=c.fill;
  } else if(ns<toSec(schedule[0].start)){
    card.style.background="#0d0d0d"; card.style.borderColor="#1c1c1c";
    pType.textContent=""; pName.style.color="#555"; pName.textContent="Brzy začínáme";
    timerVal.style.color="#555"; timerVal.textContent="--:--"; progFill.style.width="0%";
  } else {
    card.style.background="#0d0d0d"; card.style.borderColor="#1c1c1c";
    pType.textContent=""; pName.style.color="#555"; pName.textContent=labels.konec;
    timerVal.style.color="#555"; timerVal.textContent="00:00"; progFill.style.width="100%";
  }

  setNextSlot(0,schedule[nextStart]||null,true);
  setNextSlot(1,schedule[nextStart+1]||null,false);
  setNextSlot(2,schedule[nextStart+2]||null,false);
}

function extractVideoId(url){
  const p=[
    /(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/live\/)([a-zA-Z0-9_-]{11})/,
    /youtube\.com\/embed\/([a-zA-Z0-9_-]{11})/,
  ];
  for(const r of p){const m=(url||"").match(r);if(m)return m[1];}
  return null;
}

let currentVideoId=null;

function loadAll(){
  const nc=Date.now();
  const base=`https://raw.githubusercontent.com/${GITHUB_USER}/${GITHUB_REPO}/main`;

  fetch(`${base}/stream.json?nocache=${nc}`)
    .then(r=>r.json()).then(d=>{
      const vid=extractVideoId(d.url||"");
      if(vid&&vid!==currentVideoId){
        currentVideoId=vid;
        const wrap=document.getElementById("yt-wrap");
        wrap.innerHTML=`<iframe src="https://www.youtube.com/embed/${vid}?autoplay=1&mute=1&controls=1" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
      }
    }).catch(()=>{});

  fetch(`${base}/labels.json?nocache=${nc}`)
    .then(r=>r.json()).then(d=>{
      labels={
        hra:    d.hra    ||"Match",
        nastup: d.nastup ||"Warm-up",
        pauza:  d.pauza  ||"Break",
        konec:  d.konec  ||"Session complete",
      };
    }).catch(()=>{});

  fetch(`${base}/schedule.json?nocache=${nc}`)
    .then(r=>r.json()).then(d=>{
      if(Array.isArray(d)&&d.length>0) schedule=d;
    }).catch(()=>{});
}

tick();
setInterval(tick,1000);
loadAll();
setInterval(loadAll,60000);
document.addEventListener("touchmove",e=>e.preventDefault(),{passive:false});
</script>
</body>
</html>
