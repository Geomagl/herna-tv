<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Penalty Arena — Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;700;800;900&family=Barlow:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Barlow', Arial, sans-serif; }

  #layout { display: flex; width: 100vw; height: 100vh; }

  /* ── SIDEBAR ── */
  #sidebar {
    width: 240px;
    flex-shrink: 0;
    background: #000;
    border-right: 2px solid #EA2B1F;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    color: #fff;
  }

  /* Top header bar */
  .sidebar-header {
    background: #EA2B1F;
    padding: 12px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }
  .brand-name {
    font-family: 'Barlow Condensed', Arial, sans-serif;
    font-weight: 900;
    font-size: 22px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #fff;
    line-height: 1;
  }
  .brand-sub {
    font-family: 'Barlow Condensed', Arial, sans-serif;
    font-weight: 400;
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.7);
    line-height: 1;
    margin-top: 3px;
  }
  .live-dot {
    width: 8px; height: 8px;
    background: #fff;
    border-radius: 50%;
    margin-left: auto;
    animation: pulse 1.5s infinite;
    flex-shrink: 0;
  }
  @keyframes pulse {
    0%,100% { opacity: 1; transform: scale(1); }
    50%      { opacity: 0.4; transform: scale(0.8); }
  }

  /* Clock block */
  .clock-block {
    padding: 16px 16px 0 16px;
    flex-shrink: 0;
  }
  .clock-big {
    font-family: 'Barlow Condensed', Arial, sans-serif;
    font-weight: 900;
    font-size: 52px;
    letter-spacing: -1px;
    color: #fff;
    line-height: 1;
  }
  .date-label {
    font-size: 10px;
    color: #555;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-top: 4px;
  }

  /* Main card */
  .main-card {
    margin: 12px 16px;
    border-radius: 0;
    padding: 16px;
    border-left: 4px solid transparent;
    text-align: left;
    transition: background 0.4s, border-color 0.4s;
    flex-shrink: 0;
  }
  .phase-type {
    font-family: 'Barlow Condensed', Arial, sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-bottom: 4px;
    opacity: 0.7;
  }
  .phase-name {
    font-family: 'Barlow Condensed', Arial, sans-serif;
    font-weight: 900;
    font-size: 36px;
    line-height: 1;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 10px;
  }
  .timer-row { display: flex; align-items: baseline; gap: 8px; margin-bottom: 6px; }
  .timer-val {
    font-family: 'Barlow Condensed', Arial, sans-serif;
    font-weight: 900;
    font-size: 58px;
    letter-spacing: -2px;
    line-height: 1;
    color: #fff;
  }
  .timer-unit {
    font-size: 11px;
    color: #444;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 16px;
  }
  .progress-bar-bg {
    height: 3px;
    background: #1a1a1a;
    overflow: hidden;
    margin-top: 16px;
  }
  .progress-bar-fill {
    height: 100%;
    transition: width 1s linear, background 1s;
  }

  /* Divider */
  .divider {
    height: 1px;
    background: #1a1a1a;
    margin: 0 24px;
    flex-shrink: 0;
  }

  /* Next slots */
  .next-label {
    padding: 10px 16px 8px;
    font-size: 10px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: #EA2B1F;
    font-weight: 700;
    flex-shrink: 0;
  }
  .next-slots {
    display: flex;
    flex-direction: column;
    flex: 1;
    padding: 0 16px 16px;
    gap: 4px;
    overflow: hidden;
  }
  .next-slot {
    padding: 10px 12px;
    border-left: 2px solid transparent;
    display: flex;
    flex-direction: column;
    gap: 2px;
    transition: border-color 0.3s, background 0.3s;
  }
  .ns-order {
    font-size: 9px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #444;
  }
  .ns-type {
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    opacity: 0.5;
  }
  .ns-name {
    font-family: 'Barlow Condensed', Arial, sans-serif;
    font-weight: 800;
    font-size: 20px;
    text-transform: uppercase;
    letter-spacing: 1px;
    line-height: 1;
  }
  .ns-time { font-size: 12px; color: #555; margin-top: 2px; }

  .slot-dim { opacity: 0.4; }

  /* ── YOUTUBE ── */
  #yt-wrap {
    flex: 1;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  #yt-wrap iframe { width: 100%; height: 100%; border: none; display: block; }
  #no-stream {
    text-align: center;
    color: #222;
  }
  .no-stream-icon {
    font-family: 'Barlow Condensed', Arial, sans-serif;
    font-weight: 900;
    font-size: 80px;
    color: #EA2B1F;
    letter-spacing: -2px;
    text-transform: uppercase;
    line-height: 1;
    margin-bottom: 16px;
  }
  .no-stream-text {
    font-size: 13px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #2a2a2a;
  }
</style>
</head>
<body>
<div id="layout">

  <div id="sidebar">

    <div class="sidebar-header">
      <div>
        <div class="brand-name">Penalty Arena</div>
        <div class="brand-sub">Live Session</div>
      </div>
      <div class="live-dot"></div>
    </div>

    <div class="clock-block">
      <div class="clock-big" id="clock">--:--</div>
      <div class="date-label" id="date-label"></div>
    </div>

    <div class="main-card" id="main-card">
      <div class="phase-type" id="phase-type"></div>
      <div class="phase-name" id="phase-name">—</div>
      <div class="timer-row">
        <div class="timer-val" id="timer-val">--:--</div>
      </div>
      <div class="timer-unit">remaining</div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progress-fill" style="width:0%"></div>
      </div>
    </div>

    <div class="divider"></div>

    <div class="next-label">Up next</div>
    <div class="next-slots">
      <div class="next-slot" id="next0">
        <div class="ns-order">Next</div>
        <div class="ns-type" id="next0-type"></div>
        <div class="ns-name" id="next0-name">—</div>
        <div class="ns-time" id="next0-time"></div>
      </div>
      <div class="next-slot slot-dim" id="next1">
        <div class="ns-order">Then</div>
        <div class="ns-type" id="next1-type"></div>
        <div class="ns-name" id="next1-name">—</div>
        <div class="ns-time" id="next1-time"></div>
      </div>
      <div class="next-slot slot-dim" id="next2">
        <div class="ns-order">After</div>
        <div class="ns-type" id="next2-type"></div>
        <div class="ns-name" id="next2-name">—</div>
        <div class="ns-time" id="next2-time"></div>
      </div>
    </div>

  </div>

  <div id="yt-wrap">
    <div id="no-stream">
      <div class="no-stream-icon">PA</div>
      <div class="no-stream-text">Stream not configured</div>
    </div>
  </div>

</div>

<script>
const GITHUB_USER = "Geomagl";
const GITHUB_REPO = "herna-tv";

let schedule = [
  {type:"nastup",start:"08:57",end:"09:00",name:""},
  {type:"hra",start:"09:00",end:"09:25",name:""},
  {type:"nastup",start:"09:25",end:"09:28",name:""},
  {type:"hra",start:"09:28",end:"09:53",name:""},
  {type:"nastup",start:"09:53",end:"09:56",name:""},
  {type:"hra",start:"09:56",end:"10:21",name:""},
  {type:"nastup",start:"10:21",end:"10:24",name:""},
  {type:"hra",start:"10:24",end:"10:49",name:""},
  {type:"nastup",start:"10:49",end:"10:52",name:""},
  {type:"hra",start:"10:52",end:"11:17",name:""},
  {type:"nastup",start:"11:17",end:"11:20",name:""},
  {type:"hra",start:"11:20",end:"11:45",name:""},
  {type:"nastup",start:"11:45",end:"11:48",name:""},
  {type:"hra",start:"11:48",end:"12:13",name:""},
  {type:"nastup",start:"12:13",end:"12:16",name:""},
  {type:"hra",start:"12:16",end:"12:41",name:""},
  {type:"pauza",start:"12:41",end:"12:53",name:""},
  {type:"nastup",start:"12:53",end:"12:56",name:""},
  {type:"hra",start:"12:56",end:"13:21",name:""},
  {type:"nastup",start:"13:21",end:"13:24",name:""},
  {type:"hra",start:"13:24",end:"13:49",name:""},
  {type:"nastup",start:"13:49",end:"13:52",name:""},
  {type:"hra",start:"13:52",end:"14:17",name:""},
  {type:"nastup",start:"14:17",end:"14:20",name:""},
  {type:"hra",start:"14:20",end:"14:45",name:""},
  {type:"nastup",start:"14:45",end:"14:48",name:""},
  {type:"hra",start:"14:48",end:"15:13",name:""},
  {type:"nastup",start:"15:13",end:"15:16",name:""},
  {type:"hra",start:"15:16",end:"15:41",name:""},
  {type:"nastup",start:"15:41",end:"15:44",name:""},
  {type:"hra",start:"15:44",end:"16:09",name:""},
  {type:"nastup",start:"16:09",end:"16:12",name:""},
  {type:"hra",start:"16:12",end:"16:37",name:""},
  {type:"nastup",start:"16:37",end:"16:40",name:""},
  {type:"hra",start:"16:40",end:"17:05",name:""},
];

let labels = {hra:"Match",nastup:"Warm-up",pauza:"Break",konec:"Session Complete"};

// Original slot colors
const colors = {
  hra:   {bg:"#071a04", border:"#a3e635", text:"#a3e635", fill:"#a3e635"},
  nastup:{bg:"#1f1200", border:"#ff9800", text:"#ff9800", fill:"#ff9800"},
  pauza: {bg:"#0d0d1f", border:"#7c7cff", text:"#7c7cff", fill:"#7c7cff"},
};
const dimColors = {
  hra:   {bg:"#0a1f06", border:"#3a5c10", text:"#7ab82e", timeColor:"#5a8a22"},
  nastup:{bg:"#1a0e00", border:"#6b3d00", text:"#cc7a00", timeColor:"#aa6200"},
  pauza: {bg:"#0a0a1a", border:"#3a3a8a", text:"#6060cc", timeColor:"#4a4aaa"},
};

function toSec(t){const[h,m]=t.split(":").map(Number);return h*3600+m*60;}
function nowSec(){const n=new Date();return n.getHours()*3600+n.getMinutes()*60+n.getSeconds();}
function pad(n){return String(n).padStart(2,"0");}

function getColor(slot,secsLeft,totalSecs){
  if(slot.type==="nastup"){
    const ratio=secsLeft/totalSecs;
    if(ratio<=1/3){
      const t=1-(ratio/(1/3));
      const r=255, g=Math.round(152*(1-t));
      return{...colors.nastup,text:`rgb(${r},${g},0)`,fill:`rgb(${r},${g},0)`,border:`rgba(${r},${g},0,0.5)`};
    }
    return colors.nastup;
  }
  return colors[slot.type]||colors.pauza;
}

function slotTypeName(slot){
  return slot.type==="hra"?labels.hra:slot.type==="nastup"?labels.nastup:labels.pauza;
}

function setNextSlot(i,slot,bright){
  const el=document.getElementById("next"+i);
  const tp=document.getElementById("next"+i+"-type");
  const nm=document.getElementById("next"+i+"-name");
  const tm=document.getElementById("next"+i+"-time");
  if(slot){
    const hasName=slot.name&&slot.name.trim();
    if(bright){
      const c=colors[slot.type]||colors.pauza;
      el.style.borderLeftColor=c.border;
      el.style.background="rgba(255,255,255,0.02)";
      nm.style.color=c.text; tp.style.color=c.text; tm.style.color="#555";
    } else {
      const c=dimColors[slot.type]||dimColors.pauza;
      el.style.borderLeftColor=c.border;
      el.style.background="transparent";
      nm.style.color=c.text; tp.style.color=c.timeColor; tm.style.color=c.timeColor;
    }
    if(hasName){tp.textContent=slotTypeName(slot);nm.textContent=slot.name.toUpperCase();}
    else{tp.textContent="";nm.textContent=slotTypeName(slot).toUpperCase();}
    tm.textContent=slot.start+" – "+slot.end;
  } else {
    el.style.borderLeftColor="#1a1a1a";
    el.style.background="transparent";
    nm.style.color="#222"; nm.textContent="—"; tm.textContent=""; tp.textContent="";
  }
}

function tick(){
  const now=new Date();
  document.getElementById("clock").textContent=pad(now.getHours())+":"+pad(now.getMinutes());
  const days=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  const months=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  document.getElementById("date-label").textContent=days[now.getDay()]+" · "+now.getDate()+" "+months[now.getMonth()]+" "+now.getFullYear();

  const ns=nowSec();
  let cur=-1;
  for(let i=0;i<schedule.length;i++){
    if(ns>=toSec(schedule[i].start)&&ns<toSec(schedule[i].end)){cur=i;break;}
  }

  const card=document.getElementById("main-card");
  const pType=document.getElementById("phase-type");
  const pName=document.getElementById("phase-name");
  const timerVal=document.getElementById("timer-val");
  const progFill=document.getElementById("progress-fill");
  const nextStart=cur>=0?cur+1:(ns<toSec(schedule[0].start)?0:schedule.length);

  if(cur>=0){
    const slot=schedule[cur];
    const endS=toSec(slot.end),startS=toSec(slot.start);
    const totalSecs=endS-startS,secsLeft=endS-ns;
    const pct=Math.min(100,((ns-startS)/totalSecs)*100);
    const c=getColor(slot,secsLeft,totalSecs);
    card.style.background=c.bg; card.style.borderLeftColor=c.border;
    pType.style.color=c.text; pName.style.color=c.text;
    const hasName=slot.name&&slot.name.trim();
    if(hasName){pType.textContent=slotTypeName(slot).toUpperCase();pName.textContent=slot.name.toUpperCase();}
    else{pType.textContent="";pName.textContent=slotTypeName(slot).toUpperCase();}
    timerVal.style.color="#fff";
    timerVal.textContent=pad(Math.floor(secsLeft/60))+":"+pad(secsLeft%60);
    progFill.style.width=pct+"%"; progFill.style.background=c.fill;
  } else if(ns<toSec(schedule[0].start)){
    card.style.background="#0a0a0a"; card.style.borderLeftColor="#222";
    pType.textContent=""; pName.style.color="#333"; pName.textContent="SOON";
    timerVal.style.color="#333"; timerVal.textContent="--:--"; progFill.style.width="0%";
  } else {
    card.style.background="#0a0a0a"; card.style.borderLeftColor="#EA2B1F";
    pType.textContent=""; pName.style.color="#EA2B1F"; pName.textContent=labels.konec.toUpperCase();
    timerVal.style.color="#333"; timerVal.textContent="--:--"; progFill.style.width="100%";
  }

  setNextSlot(0,schedule[nextStart]||null,true);
  setNextSlot(1,schedule[nextStart+1]||null,false);
  setNextSlot(2,schedule[nextStart+2]||null,false);
}

function extractVideoId(url){
  const p=[/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/live\/)([a-zA-Z0-9_-]{11})/,/youtube\.com\/embed\/([a-zA-Z0-9_-]{11})/];
  for(const r of p){const m=(url||"").match(r);if(m)return m[1];}
  return null;
}

let currentVideoId=null;

function loadAll(){
  const nc=Date.now();
  const base=`https://raw.githubusercontent.com/${GITHUB_USER}/${GITHUB_REPO}/main`;
  fetch(`${base}/stream.json?nocache=${nc}`).then(r=>r.json()).then(d=>{
    const vid=extractVideoId(d.url||"");
    if(vid&&vid!==currentVideoId){
      currentVideoId=vid;
      document.getElementById("yt-wrap").innerHTML=`<iframe src="https://www.youtube.com/embed/${vid}?autoplay=1&mute=1&controls=1" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
    }
  }).catch(()=>{});
  fetch(`${base}/labels.json?nocache=${nc}`).then(r=>r.json()).then(d=>{
    labels={hra:d.hra||"Match",nastup:d.nastup||"Warm-up",pauza:d.pauza||"Break",konec:d.konec||"Session Complete"};
  }).catch(()=>{});
  fetch(`${base}/schedule.json?nocache=${nc}`).then(r=>r.json()).then(d=>{
    if(Array.isArray(d)&&d.length>0) schedule=d;
  }).catch(()=>{});
}

tick();
setInterval(tick,1000);
loadAll();
setInterval(loadAll,60000);
document.addEventListener("touchmove",e=>e.preventDefault(),{passive:false});
</script>
</body>
</html>
