<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Penalty Arena — Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;700;800;900&family=Barlow:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Barlow', Arial, sans-serif; }

  #layout { display: flex; width: 100vw; height: 100vh; }

  /* ── SIDEBAR ── */
  #sidebar {
    width: 240px;
    flex-shrink: 0;
    background: #000;
    border-right: 2px solid #EA2B1F;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    color: #fff;
  }

  /* Top header bar */
  .sidebar-header {
    background: #EA2B1F;
    padding: 10px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  .brand-logo svg { display: block; height: 32px; width: auto; }
  .brand-logo svg path, .brand-logo svg .cls-1 { fill: #fff !important; }
  .live-dot {
    width: 8px; height: 8px;
    background: #fff;
    border-radius: 50%;
    animation: pulse 1.5s infinite;
    flex-shrink: 0;
  }
  @keyframes pulse {
    0%,100% { opacity: 1; transform: scale(1); }
    50%      { opacity: 0.4; transform: scale(0.8); }
  }

  /* Clock block */
  .clock-block {
    padding: 16px 16px 0 16px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .clock-text { flex: 1; min-width: 0; }
  .mascot-wrap {
    flex-shrink: 0;
    width: 85px;
    position: relative;
  }
  .mascot-img {
    width: 85px;
    height: 90px;
    display: block;
    object-fit: cover;
    object-position: top center;
  }
  .bubble {
    position: absolute;
    bottom: 100%;
    right: -4px;
    background: #fff;
    color: #111;
    font-family: 'Barlow Condensed', Arial, sans-serif;
    font-weight: 700;
    font-size: 11px;
    line-height: 1.3;
    letter-spacing: 0.5px;
    padding: 8px 10px;
    border-radius: 10px 10px 2px 10px;
    width: 180px;
    text-align: left;
    box-shadow: 0 2px 12px rgba(0,0,0,0.5);
    opacity: 0;
    transform: scale(0.8) translateY(4px);
    transform-origin: bottom right;
    transition: opacity 0.3s, transform 0.3s;
    pointer-events: none;
    z-index: 10;
  }
  .bubble.visible {
    opacity: 1;
    transform: scale(1) translateY(0);
  }
  .bubble::after {
    content: '';
    position: absolute;
    bottom: -6px;
    right: 10px;
    width: 0; height: 0;
    border-left: 6px solid transparent;
    border-right: 0px solid transparent;
    border-top: 6px solid #fff;
  }
  .clock-big {
    font-family: 'Barlow Condensed', Arial, sans-serif;
    font-weight: 700;
    font-size: 52px;
    letter-spacing: 4px;
    color: #fff;
    line-height: 1;
  }
  .date-label {
    font-size: 10px;
    color: #555;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-top: 4px;
  }

  /* Main card */
  .main-card {
    margin: 12px 16px;
    border-radius: 0;
    padding: 16px;
    border-left: 4px solid transparent;
    text-align: left;
    transition: background 0.4s, border-color 0.4s;
    flex-shrink: 0;
  }
  .phase-type {
    font-family: 'Barlow Condensed', Arial, sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-bottom: 4px;
    opacity: 0.7;
  }
  .phase-name {
    font-family: 'Barlow Condensed', Arial, sans-serif;
    font-weight: 700;
    font-size: 36px;
    line-height: 1;
    text-transform: uppercase;
    letter-spacing: 3px;
    margin-bottom: 10px;
  }
  .timer-row { display: flex; align-items: baseline; gap: 8px; margin-bottom: 6px; }
  .timer-val {
    font-family: 'Barlow Condensed', Arial, sans-serif;
    font-weight: 700;
    font-size: 58px;
    letter-spacing: 4px;
    line-height: 1;
    color: #fff;
  }
  .timer-unit {
    font-size: 11px;
    color: #444;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 16px;
  }
  .progress-bar-bg {
    height: 3px;
    background: #1a1a1a;
    overflow: hidden;
    margin-top: 16px;
  }
  .progress-bar-fill {
    height: 100%;
    transition: width 1s linear, background 1s;
  }

  /* Divider */
  .divider {
    height: 1px;
    background: #1a1a1a;
    margin: 0 24px;
    flex-shrink: 0;
  }

  /* Next slots */
  .next-label {
    padding: 10px 16px 8px;
    font-size: 10px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: #EA2B1F;
    font-weight: 700;
    flex-shrink: 0;
  }
  .next-slots {
    display: flex;
    flex-direction: column;
    flex: 1;
    padding: 0 16px 16px;
    gap: 4px;
    overflow: hidden;
  }
  .next-slot {
    padding: 10px 12px;
    border-left: 2px solid transparent;
    display: flex;
    flex-direction: column;
    gap: 2px;
    transition: border-color 0.3s, background 0.3s;
  }
  @keyframes slotPulse {
    0%,100% { opacity: 1; }
    50%      { opacity: 0.35; }
  }
  .next-slot.urgent {
    animation: slotPulse 1.2s ease-in-out infinite;
  }
  .ns-order {
    font-size: 9px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #444;
  }
  .ns-type {
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    opacity: 0.5;
  }
  .ns-name {
    font-family: 'Barlow Condensed', Arial, sans-serif;
    font-weight: 700;
    font-size: 20px;
    text-transform: uppercase;
    letter-spacing: 3px;
    line-height: 1;
  }
  .ns-time { font-size: 12px; color: #777; margin-top: 2px; }

  .slot-dim { opacity: 0.6; }

  /* ── YOUTUBE ── */
  #yt-wrap {
    flex: 1;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  #yt-wrap iframe { width: 100%; height: 100%; border: none; display: block; }

  /* Mascot video overlay */
  #mascot-overlay {
    position: absolute;
    bottom: 0;
    right: 0;
    width: 55%;
    height: 100%;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.6s ease;
    z-index: 10;
    display: flex;
    align-items: flex-end;
    justify-content: flex-end;
  }
  #mascot-overlay.visible { opacity: 1; }
  #mascot-overlay video {
    width: 100%;
    height: 100%;
    object-fit: contain;
    object-position: bottom right;
  }
  #no-stream {
    text-align: center;
    color: #222;
  }
  .no-stream-icon {
    font-family: 'Barlow Condensed', Arial, sans-serif;
    font-weight: 700;
    font-size: 80px;
    color: #EA2B1F;
    letter-spacing: -2px;
    text-transform: uppercase;
    line-height: 1;
    margin-bottom: 16px;
  }
  .no-stream-text {
    font-size: 13px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #2a2a2a;
  }
</style>

// Original slot colors
const colors = {
  hra:   {bg:"#071a04", border:"#a3e635", text:"#a3e635", fill:"#a3e635"},
  nastup:{bg:"#1f1200", border:"#ff9800", text:"#ff9800", fill:"#ff9800"},
  pauza: {bg:"#0d0d1f", border:"#7c7cff", text:"#7c7cff", fill:"#7c7cff"},
};
const dimColors = {
  hra:   {bg:"#0a1f06", border:"#3a5c10", text:"#7ab82e", timeColor:"#5a8a22"},
  nastup:{bg:"#1a0e00", border:"#6b3d00", text:"#cc7a00", timeColor:"#aa6200"},
  pauza: {bg:"#0a0a1a", border:"#3a3a8a", text:"#6060cc", timeColor:"#4a4aaa"},
};

function toSec(t){const[h,m]=t.split(":").map(Number);return h*3600+m*60;}
function nowSec(){const n=new Date();return n.getHours()*3600+n.getMinutes()*60+n.getSeconds();}
function pad(n){return String(n).padStart(2,"0");}

function getColor(slot,secsLeft,totalSecs){
  if(slot.type==="nastup"){
    const ratio=secsLeft/totalSecs;
    if(ratio<=1/3){
      const t=1-(ratio/(1/3));
      const r=255, g=Math.round(152*(1-t));
      return{...colors.nastup,text:`rgb(${r},${g},0)`,fill:`rgb(${r},${g},0)`,border:`rgba(${r},${g},0,0.5)`};
    }
    return colors.nastup;
  }
  return colors[slot.type]||colors.pauza;
}

function slotTypeName(slot){
  return slot.type==="hra"?labels.hra:slot.type==="nastup"?labels.nastup:labels.pauza;
}

function setNextSlot(i,slot,bright){
  const el=document.getElementById("next"+i);
  const tp=document.getElementById("next"+i+"-type");
  const nm=document.getElementById("next"+i+"-name");
  const tm=document.getElementById("next"+i+"-time");
  if(slot){
    const hasName=slot.name&&slot.name.trim();
    if(bright){
      const c=colors[slot.type]||colors.pauza;
      el.style.borderLeftColor=c.border;
      el.style.background="rgba(255,255,255,0.02)";
      nm.style.color=c.text; tp.style.color=c.text; tm.style.color="#555";
    } else {
      const c=dimColors[slot.type]||dimColors.pauza;
      el.style.borderLeftColor=c.border;
      el.style.background="transparent";
      nm.style.color=c.text; tp.style.color=c.timeColor; tm.style.color=c.timeColor;
    }
    if(hasName){tp.textContent=slotTypeName(slot);nm.textContent=slot.name.toUpperCase();}
    else{tp.textContent="";nm.textContent=slotTypeName(slot).toUpperCase();}
    tm.textContent=slot.start+" – "+slot.end;
  } else {
    el.style.borderLeftColor="#1a1a1a";
    el.style.background="transparent";
    nm.style.color="#222"; nm.textContent="—"; tm.textContent=""; tp.textContent="";
  }
}

function tick(){
  const now=new Date();
  document.getElementById("clock").textContent=pad(now.getHours())+":"+pad(now.getMinutes());
  const days=["Neděle","Pondělí","Úterý","Středa","Čtvrtek","Pátek","Sobota"];
  const months=["led","úno","bře","dub","kvě","čvn","čvc","srp","zář","říj","lis","pro"];
  document.getElementById("date-label").textContent=days[now.getDay()]+" · "+now.getDate()+" "+months[now.getMonth()]+" "+now.getFullYear();

  const ns=nowSec();
  let cur=-1;
  for(let i=0;i<schedule.length;i++){
    if(ns>=toSec(schedule[i].start)&&ns<toSec(schedule[i].end)){cur=i;break;}
  }

  const card=document.getElementById("main-card");
  const pType=document.getElementById("phase-type");
  const pName=document.getElementById("phase-name");
  const timerVal=document.getElementById("timer-val");
  const progFill=document.getElementById("progress-fill");
  const nextStart=cur>=0?cur+1:(ns<toSec(schedule[0].start)?0:schedule.length);

  if(cur>=0){
    const slot=schedule[cur];
    const endS=toSec(slot.end),startS=toSec(slot.start);
    const totalSecs=endS-startS,secsLeft=endS-ns;
    const pct=Math.min(100,((ns-startS)/totalSecs)*100);
    const c=getColor(slot,secsLeft,totalSecs);
    card.style.background=c.bg; card.style.borderLeftColor=c.border;
    pType.style.color=c.text; pName.style.color=c.text;
    const hasName=slot.name&&slot.name.trim();
    if(hasName){pType.textContent=slotTypeName(slot).toUpperCase();pName.textContent=slot.name.toUpperCase();}
    else{pType.textContent="";pName.textContent=slotTypeName(slot).toUpperCase();}
    timerVal.style.color="#fff";
    timerVal.textContent=pad(Math.floor(secsLeft/60))+":"+pad(secsLeft%60);
    progFill.style.width=pct+"%"; progFill.style.background=c.fill;
  } else if(ns<toSec(schedule[0].start)){
    card.style.background="#0a0a0a"; card.style.borderLeftColor="#222";
    pType.textContent=""; pName.style.color="#333"; pName.textContent="BRZY";
    timerVal.style.color="#333"; timerVal.textContent="--:--"; progFill.style.width="0%";
  } else {
    card.style.background="#0a0a0a"; card.style.borderLeftColor="#EA2B1F";
    pType.textContent=""; pName.style.color="#EA2B1F"; pName.textContent=labels.konec.toUpperCase();
    timerVal.style.color="#333"; timerVal.textContent="--:--"; progFill.style.width="100%";
  }

  setNextSlot(0,schedule[nextStart]||null,true);
  setNextSlot(1,schedule[nextStart+1]||null,false);
  setNextSlot(2,schedule[nextStart+2]||null,false);

  // Blikání — pokud do konce aktuálního slotu zbývá méně než 60s
  const next0el = document.getElementById("next0");
  if(cur>=0){
    const secsToEnd = toSec(schedule[cur].end) - ns;
    if(secsToEnd <= 60 && secsToEnd > 0){
      next0el.classList.add("urgent");
    } else {
      next0el.classList.remove("urgent");
    }
  } else {
    next0el.classList.remove("urgent");
  }

  // Bubble logic — show when match has <= 5min left
  if(cur>=0 && schedule[cur].type==="hra"){
    const secsLeft2 = toSec(schedule[cur].end) - ns;
    if(secsLeft2 <= 300 && secsLeft2 > 0){
      const warmupName = getNextWarmupName(cur);
      startBubble(warmupName);
    } else {
      stopBubble();
    }
  } else {
    stopBubble();
  }
}

let messages = [
  "5 minut do konce! {name}, choď se rozehřát!",
  "{name}, za 5 minut jdeš! Nesmíš nastoupit pozdě!",
  "Pozor! {name} nastupuje za chvíli!",
  "Tick tock... {name} máš 5 minut!"
];
let bubbleIndex = 0;
let bubbleInterval = null;

function getNextWarmupName(curIdx){
  const nxt = schedule.slice(curIdx+1).find(s=>s.type==="nastup");
  return nxt ? (nxt.name||"") : "";
}

function showBubble(name){
  const bubble = document.getElementById("bubble");
  const msg = messages[bubbleIndex % messages.length];
  bubble.textContent = msg.replace(/{name}/g, name||"hráč");
  bubble.classList.add("visible");
  bubbleIndex++;
}

function hideBubble(){
  document.getElementById("bubble").classList.remove("visible");
}

function startBubble(name){
  if(bubbleInterval) return; // already running
  showBubble(name);
  bubbleInterval = setInterval(()=>showBubble(name), 20000);
}

function stopBubble(){
  hideBubble();
  if(bubbleInterval){ clearInterval(bubbleInterval); bubbleInterval=null; }
  bubbleIndex=0;
}

function extractVideoId(url){
  const p=[/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/live\/)([a-zA-Z0-9_-]{11})/,/youtube\.com\/embed\/([a-zA-Z0-9_-]{11})/];
  for(const r of p){const m=(url||"").match(r);if(m)return m[1];}
  return null;
}

let currentVideoId=null;

function loadAll(){
  const nc=Date.now();
  const base=`https://raw.githubusercontent.com/${GITHUB_USER}/${GITHUB_REPO}/main`;
  fetch(`${base}/stream.json?nocache=${nc}`).then(r=>r.json()).then(d=>{
    const vid=extractVideoId(d.url||"");
    if(vid&&vid!==currentVideoId){
      currentVideoId=vid;
      document.getElementById("yt-wrap").innerHTML=`<iframe src="https://www.youtube.com/embed/${vid}?autoplay=1&mute=1&controls=1" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
    }
  }).catch(()=>{});
  fetch(`${base}/labels.json?nocache=${nc}`).then(r=>r.json()).then(d=>{
    labels={hra:d.hra||"Zápas",nastup:d.nastup||"Nástup",pauza:d.pauza||"Přestávka",konec:d.konec||"Konec sessiony"};
  }).catch(()=>{});
  fetch(`${base}/schedule.json?nocache=${nc}`).then(r=>r.json()).then(d=>{
    if(Array.isArray(d)&&d.length>0) schedule=d;
  }).catch(()=>{});
  fetch(`${base}/messages.json?nocache=${nc}`).then(r=>r.json()).then(d=>{
    if(Array.isArray(d)&&d.length>0) messages=d;
  }).catch(()=>{});
}

/* ── Mascot video overlay — every 10min 9:00–16:50 ── */
const OVERLAY_TIMES = (()=>{
  const times=[];
  for(let h=9;h<=16;h++){
    for(let m=0;m<60;m+=10){
      if(h===16&&m>50) break;
      times.push(h*3600+m*60);
    }
  }
  return times; // [32400, 33000, 33600, ...]
})();

let overlayShownThisMinute = false;
let lastOverlayMinute = -1;

function checkOverlay(){
  const ns = nowSec();
  // Find if current second matches any overlay time (within 5s window)
  const match = OVERLAY_TIMES.some(t => ns >= t && ns < t+5);
  const currentMinuteKey = Math.floor(ns/60);

  if(match && currentMinuteKey !== lastOverlayMinute){
    lastOverlayMinute = currentMinuteKey;
    playMascotOverlay();
  }
}

function playMascotOverlay(){
  const overlay = document.getElementById("mascot-overlay");
  const video   = document.getElementById("mascot-video");
  if(!overlay || !video) return;

  video.currentTime = 0;
  video.muted = false;
  overlay.classList.add("visible");
  video.play().catch(()=>{ video.muted=true; video.play(); });

  video.onended = ()=>{
    overlay.classList.remove("visible");
  };
}

tick();
setInterval(tick,1000);
setInterval(checkOverlay,1000);
loadAll();
setInterval(loadAll,60000);
document.addEventListener("touchmove",e=>e.preventDefault(),{passive:false});
</script>
