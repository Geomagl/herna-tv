<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Herna TV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; background: #0a0a0a; font-family: 'Inter', sans-serif; color: #fff; padding: 24px; }

  .page { max-width: 860px; margin: 0 auto; }

  .logo { font-size: 13px; letter-spacing: 4px; text-transform: uppercase; color: #555; margin-bottom: 8px; }
  h1   { font-size: 28px; font-weight: 500; margin-bottom: 8px; }
  .subtitle { font-size: 14px; color: #555; margin-bottom: 36px; }

  .section {
    background: #111;
    border: 1px solid #222;
    border-radius: 16px;
    padding: 28px 32px;
    margin-bottom: 20px;
  }
  .section-title {
    font-size: 13px; letter-spacing: 3px; text-transform: uppercase;
    color: #666; margin-bottom: 20px;
  }

  label { display: block; font-size: 12px; letter-spacing: 2px; text-transform: uppercase; color: #666; margin-bottom: 8px; }

  input[type="text"], input[type="password"], input[type="time"] {
    background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 8px;
    padding: 12px 14px; font-size: 14px; color: #fff;
    font-family: 'Inter', sans-serif; outline: none; transition: border-color 0.2s;
  }
  input[type="text"]:focus, input[type="password"]:focus, input[type="time"]:focus { border-color: #555; }
  input[type="time"] { width: 110px; }

  .full-input { width: 100%; margin-bottom: 16px; }

  .btn {
    background: #a3e635; color: #0a0a0a; border: none; border-radius: 10px;
    padding: 14px 24px; font-size: 15px; font-weight: 500;
    font-family: 'Inter', sans-serif; cursor: pointer; transition: background 0.2s, transform 0.1s;
  }
  .btn:hover   { background: #bef264; }
  .btn:active  { transform: scale(0.98); }
  .btn:disabled { background: #2a2a2a; color: #555; cursor: not-allowed; transform: none; }
  .btn-full { width: 100%; padding: 16px; font-size: 16px; }
  .btn-sm { padding: 8px 16px; font-size: 13px; }
  .btn-dim { background: #1a1a1a; color: #aaa; border: 1px solid #2a2a2a; }
  .btn-dim:hover { background: #222; color: #fff; }

  .status { margin-top: 16px; padding: 12px 16px; border-radius: 10px; font-size: 14px; display: none; }
  .status.ok      { background: #071a04; border: 1px solid #a3e635; color: #a3e635; display: block; }
  .status.error   { background: #1f0000; border: 1px solid #ff4444; color: #ff6666; display: block; }
  .status.loading { background: #111;    border: 1px solid #333;    color: #888;    display: block; }

  /* Paste zone */
  .paste-zone {
    background: #0d0d0d; border: 2px dashed #2a2a2a; border-radius: 12px;
    padding: 20px; margin-bottom: 16px; cursor: text;
    transition: border-color 0.2s;
  }
  .paste-zone:focus-within { border-color: #555; }
  .paste-zone textarea {
    width: 100%; background: transparent; border: none; outline: none;
    color: #888; font-family: 'Inter', sans-serif; font-size: 13px;
    resize: none; min-height: 80px;
  }
  .paste-hint { font-size: 12px; color: #444; margin-bottom: 8px; letter-spacing: 1px; }

  /* Schedule table */
  .sched-table { width: 100%; border-collapse: collapse; }
  .sched-table th {
    font-size: 11px; letter-spacing: 2px; text-transform: uppercase;
    color: #444; padding: 0 8px 12px 8px; text-align: left;
  }
  .sched-row { border-top: 1px solid #1a1a1a; }
  .sched-row td { padding: 8px; vertical-align: middle; }

  .type-badge {
    font-size: 10px; letter-spacing: 2px; text-transform: uppercase;
    padding: 3px 8px; border-radius: 6px; font-weight: 500; white-space: nowrap;
  }
  .badge-hra    { background: #071a04; color: #a3e635; border: 1px solid #2a4a10; }
  .badge-nastup { background: #1f1200; color: #ff9800; border: 1px solid #4d2e00; }
  .badge-pauza  { background: #0d0d1f; color: #7c7cff; border: 1px solid #2a2a5a; }

  .time-inputs { display: flex; align-items: center; gap: 6px; font-size: 13px; color: #555; }
  .name-input  { background: #1a1a1a; border: 1px solid #222; border-radius: 6px; padding: 8px 10px; font-size: 14px; color: #fff; font-family: 'Inter', sans-serif; outline: none; width: 140px; }
  .name-input:focus { border-color: #555; }
  .name-input.nastup-auto { color: #666; font-style: italic; }

  /* Labels grid */
  .labels-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .label-field { display: flex; flex-direction: column; gap: 8px; }
  .label-field input { margin-bottom: 0; }

  /* Stream preview */
  .preview-thumb { margin-top: 12px; border-radius: 8px; overflow: hidden; display: none; max-width: 320px; }
  .preview-thumb img { width: 100%; display: block; }
  .current-url { font-size: 13px; color: #555; word-break: break-all; margin-top: 8px; }
</style>
</head>
<body>
<div class="page">
  <div class="logo">Herna TV</div>
  <h1>Admin panel</h1>
  <p class="subtitle">Nastav stream, jména hráčů a časy pro dnešní den.</p>

  <!-- TOKEN + STREAM -->
  <div class="section">
    <div class="section-title">Přístup &amp; Stream</div>
    <label>GitHub Token</label>
    <input type="password" id="token" class="full-input" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx" autocomplete="off">
    <label>YouTube Live odkaz</label>
    <input type="text" id="yturl" class="full-input" placeholder="https://www.youtube.com/watch?v=...">
    <div class="preview-thumb" id="preview-thumb"><img id="preview-img" src="" alt="náhled"></div>
    <div class="current-url" id="current-url"></div>
  </div>

  <!-- LABELS -->
  <div class="section">
    <div class="section-title">Názvy na TV</div>
    <div class="labels-grid">
      <div class="label-field">
        <span class="type-badge badge-hra" style="width:fit-content">Hra</span>
        <input type="text" id="label-hra" placeholder="Match">
      </div>
      <div class="label-field">
        <span class="type-badge badge-nastup" style="width:fit-content">Nástup</span>
        <input type="text" id="label-nastup" placeholder="Warm-up">
      </div>
      <div class="label-field">
        <span class="type-badge badge-pauza" style="width:fit-content">Přestávka</span>
        <input type="text" id="label-pauza" placeholder="Break">
      </div>
      <div class="label-field">
        <span class="type-badge" style="background:#1a1a1a;color:#888;border:1px solid #333;width:fit-content">Konec</span>
        <input type="text" id="label-konec" placeholder="Session complete">
      </div>
    </div>
  </div>

  <!-- PASTE + SCHEDULE -->
  <div class="section">
    <div class="section-title">Jména hráčů — vložit z Google Sheets</div>
    <div class="paste-hint">Zkopíruj jména ze Sheets (jeden sloupec) a vlož sem pomocí Ctrl+V — přiřadí se postupně k Match slotům</div>
    <div class="paste-zone">
      <textarea id="paste-area" placeholder="Sem vlož jména (Ctrl+V)&#10;Příklad:&#10;Filip&#10;Tomáš&#10;Abassi"></textarea>
    </div>
    <button class="btn btn-sm btn-dim" onclick="parsePaste()">Načíst jména ze Sheets</button>

    <div style="margin-top: 24px;">
      <table class="sched-table">
        <thead>
          <tr>
            <th>Typ</th>
            <th>Začátek</th>
            <th>Konec</th>
            <th>Jméno hráče</th>
          </tr>
        </thead>
        <tbody id="sched-body"></tbody>
      </table>
    </div>
  </div>

  <!-- SAVE -->
  <button class="btn btn-full" id="save-btn" onclick="saveAll()">Uložit vše a spustit na TV</button>
  <div class="status" id="status"></div>
  <div style="height: 40px;"></div>
</div>

<script>
const GITHUB_USER = "Geomagl";
const GITHUB_REPO = "herna-tv";

const defaultSchedule = [
  {type:"nastup",start:"08:57",end:"09:00"},
  {type:"hra",   start:"09:00",end:"09:25"},
  {type:"nastup",start:"09:25",end:"09:28"},
  {type:"hra",   start:"09:28",end:"09:53"},
  {type:"nastup",start:"09:53",end:"09:56"},
  {type:"hra",   start:"09:56",end:"10:21"},
  {type:"nastup",start:"10:21",end:"10:24"},
  {type:"hra",   start:"10:24",end:"10:49"},
  {type:"nastup",start:"10:49",end:"10:52"},
  {type:"hra",   start:"10:52",end:"11:17"},
  {type:"nastup",start:"11:17",end:"11:20"},
  {type:"hra",   start:"11:20",end:"11:45"},
  {type:"nastup",start:"11:45",end:"11:48"},
  {type:"hra",   start:"11:48",end:"12:13"},
  {type:"nastup",start:"12:13",end:"12:16"},
  {type:"hra",   start:"12:16",end:"12:41"},
  {type:"pauza", start:"12:41",end:"12:53"},
  {type:"nastup",start:"12:53",end:"12:56"},
  {type:"hra",   start:"12:56",end:"13:21"},
  {type:"nastup",start:"13:21",end:"13:24"},
  {type:"hra",   start:"13:24",end:"13:49"},
  {type:"nastup",start:"13:49",end:"13:52"},
  {type:"hra",   start:"13:52",end:"14:17"},
  {type:"nastup",start:"14:17",end:"14:20"},
  {type:"hra",   start:"14:20",end:"14:45"},
  {type:"nastup",start:"14:45",end:"14:48"},
  {type:"hra",   start:"14:48",end:"15:13"},
  {type:"nastup",start:"15:13",end:"15:16"},
  {type:"hra",   start:"15:16",end:"15:41"},
  {type:"nastup",start:"15:41",end:"15:44"},
  {type:"hra",   start:"15:44",end:"16:09"},
  {type:"nastup",start:"16:09",end:"16:12"},
  {type:"hra",   start:"16:12",end:"16:37"},
  {type:"nastup",start:"16:37",end:"16:40"},
  {type:"hra",   start:"16:40",end:"17:05"},
];

// Working copy
let slots = defaultSchedule.map(s=>({...s, name:""}));

function extractVideoId(url){
  const p=[
    /(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/live\/)([a-zA-Z0-9_-]{11})/,
    /youtube\.com\/embed\/([a-zA-Z0-9_-]{11})/,
  ];
  for(const r of p){const m=(url||"").match(r);if(m)return m[1];}
  return null;
}

function setStatus(msg,type){
  const el=document.getElementById("status");
  el.textContent=msg; el.className="status "+type;
}

/* ── Build schedule table ── */
function buildTable(){
  const tbody=document.getElementById("sched-body");
  tbody.innerHTML="";
  slots.forEach((slot,i)=>{
    const tr=document.createElement("tr");
    tr.className="sched-row";
    const badgeClass=slot.type==="hra"?"badge-hra":slot.type==="nastup"?"badge-nastup":"badge-pauza";
    const typeLabel=slot.type==="hra"?"Hra":slot.type==="nastup"?"Nástup":"Přestávka";

    let nameCell="";
    if(slot.type==="hra"){
      nameCell=`<input class="name-input" data-i="${i}" placeholder="Jméno hráče" value="${slot.name||""}" oninput="onNameChange(${i},this.value)">`;
    } else if(slot.type==="nastup"){
      // Warm-up gets name from next hra
      const nextHra=slots.slice(i+1).find(s=>s.type==="hra");
      const autoName=nextHra?nextHra.name:"";
      nameCell=`<input class="name-input nastup-auto" data-i="${i}" placeholder="← z Match" value="${autoName}" readonly title="Přebírá jméno z následující hry">`;
    } else {
      nameCell=`<span style="color:#444;font-size:13px">—</span>`;
    }

    tr.innerHTML=`
      <td><span class="type-badge ${badgeClass}">${typeLabel}</span></td>
      <td><input type="time" class="time-start" data-i="${i}" value="${slot.start}" oninput="slots[${i}].start=this.value"></td>
      <td><input type="time" class="time-end"   data-i="${i}" value="${slot.end}"   oninput="slots[${i}].end=this.value"></td>
      <td>${nameCell}</td>
    `;
    tbody.appendChild(tr);
  });
}

function onNameChange(i, val){
  slots[i].name=val;
  // Update all nastup rows that precede a hra — refresh their auto fields
  refreshNastupNames();
}

function refreshNastupNames(){
  document.querySelectorAll(".nastup-auto").forEach(inp=>{
    const i=parseInt(inp.dataset.i);
    const nextHra=slots.slice(i+1).find(s=>s.type==="hra");
    inp.value=nextHra?nextHra.name:"";
  });
}

/* ── Parse paste — jména pouze, jedno na řádek ── */
function parsePaste(){
  const raw=document.getElementById("paste-area").value.trim();
  if(!raw){alert("Nejdříve vlož jména.");return;}

  const lines=raw.split("\n").map(l=>l.trim()).filter(Boolean);
  const hraSlots=slots.filter(s=>s.type==="hra");

  lines.forEach((line,i)=>{
    if(i<hraSlots.length) hraSlots[i].name=line;
  });

  buildTable();
  document.getElementById("paste-area").value="";
  setStatus(`✓ Načteno ${Math.min(lines.length,hraSlots.length)} jmen.`,"ok");
}

// Also auto-parse on paste event
document.addEventListener("DOMContentLoaded",()=>{
  document.getElementById("paste-area").addEventListener("paste",()=>{
    setTimeout(parsePaste,50);
  });
});

/* ── GitHub helpers ── */
async function ghPut(file, content, token, message){
  const apiUrl=`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${file}`;
  let sha=null;
  const getRes=await fetch(apiUrl,{headers:{"Authorization":"token "+token,"Accept":"application/vnd.github+json"}});
  if(getRes.ok){const d=await getRes.json();sha=d.sha;}
  const body={message,content:btoa(unescape(encodeURIComponent(content)))};
  if(sha) body.sha=sha;
  const putRes=await fetch(apiUrl,{
    method:"PUT",
    headers:{"Authorization":"token "+token,"Accept":"application/vnd.github+json","Content-Type":"application/json"},
    body:JSON.stringify(body)
  });
  return putRes.ok;
}

/* ── Save all ── */
async function saveAll(){
  const token=document.getElementById("token").value.trim();
  const url  =document.getElementById("yturl").value.trim();
  const btn  =document.getElementById("save-btn");

  if(!token){setStatus("Zadej GitHub token.","error");return;}
  if(!url)  {setStatus("Zadej YouTube odkaz.","error");return;}
  if(!extractVideoId(url)){setStatus("Odkaz nevypadá jako platný YouTube link.","error");return;}

  btn.disabled=true;
  setStatus("Ukládám...","loading");

  const labels={
    hra:    document.getElementById("label-hra").value.trim()    ||"Match",
    nastup: document.getElementById("label-nastup").value.trim() ||"Warm-up",
    pauza:  document.getElementById("label-pauza").value.trim()  ||"Break",
    konec:  document.getElementById("label-konec").value.trim()  ||"Session complete",
  };

  // Build schedule with names — nastup inherits from next hra
  const scheduleOut=slots.map((slot,i)=>{
    let name=slot.name||"";
    if(slot.type==="nastup"){
      const nextHra=slots.slice(i+1).find(s=>s.type==="hra");
      name=nextHra?nextHra.name:"";
    }
    return {type:slot.type, start:slot.start, end:slot.end, name};
  });

  const ok1=await ghPut("stream.json",   JSON.stringify({url, updated:new Date().toISOString()}), token,"Update stream");
  const ok2=await ghPut("labels.json",   JSON.stringify(labels),                                   token,"Update labels");
  const ok3=await ghPut("schedule.json", JSON.stringify(scheduleOut),                              token,"Update schedule");
  if(false&&[
    ghPut("stream.json",   JSON.stringify({url, updated:new Date().toISOString()}),   token,"Update stream"),
    ghPut("labels.json",   JSON.stringify(labels),                                     token,"Update labels"),
    ghPut("schedule.json", JSON.stringify(scheduleOut),                                token,"Update schedule"),
  ]);

  if(ok1&&ok2&&ok3){
    setStatus("✓ Uloženo! TV se aktualizuje do 60 sekund.","ok");
    localStorage.setItem("gh_token",token);
  } else {
    setStatus("Chyba při ukládání — zkontroluj token.","error");
  }
  btn.disabled=false;
}

/* ── Load existing data ── */
async function loadExisting(){
  const nc=Date.now();
  try{
    const [sRes,lRes,scRes]=await Promise.all([
      fetch(`https://raw.githubusercontent.com/${GITHUB_USER}/${GITHUB_REPO}/main/stream.json?nocache=${nc}`),
      fetch(`https://raw.githubusercontent.com/${GITHUB_USER}/${GITHUB_REPO}/main/labels.json?nocache=${nc}`),
      fetch(`https://raw.githubusercontent.com/${GITHUB_USER}/${GITHUB_REPO}/main/schedule.json?nocache=${nc}`),
    ]);
    if(sRes.ok){
      const d=await sRes.json();
      if(d.url) document.getElementById("yturl").value=d.url;
      const vid=extractVideoId(d.url||"");
      if(vid){document.getElementById("preview-img").src=`https://img.youtube.com/vi/${vid}/mqdefault.jpg`;document.getElementById("preview-thumb").style.display="block";}
      document.getElementById("current-url").textContent=d.url||"";
    }
    if(lRes.ok){
      const d=await lRes.json();
      if(d.hra)    document.getElementById("label-hra").value   =d.hra;
      if(d.nastup) document.getElementById("label-nastup").value=d.nastup;
      if(d.pauza)  document.getElementById("label-pauza").value =d.pauza;
      if(d.konec)  document.getElementById("label-konec").value =d.konec;
    }
    if(scRes.ok){
      const d=await scRes.json();
      if(Array.isArray(d)&&d.length>0){
        slots=d.map(s=>({type:s.type,start:s.start,end:s.end,name:s.name||""}));
      }
    }
  }catch(e){}
  buildTable();
}

document.getElementById("yturl").addEventListener("input",function(){
  const vid=extractVideoId(this.value);
  if(vid){document.getElementById("preview-img").src=`https://img.youtube.com/vi/${vid}/mqdefault.jpg`;document.getElementById("preview-thumb").style.display="block";}
  else   {document.getElementById("preview-thumb").style.display="none";}
});

const saved=localStorage.getItem("gh_token");
if(saved) document.getElementById("token").value=saved;

loadExisting();
</script>
</body>
</html>
